name: tests

on:
  push:
  pull_request:

jobs:
  detection:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.11 is what Debian 12 ships, which is the documented target.
        # The others guard against the codebase drifting away from newer runtimes.
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install pymupdf
      - name: Run the offline detection suite
        run: python test_crop.py /tmp/testout
      - name: Check every case produced a preview
        run: |
          count=$(ls /tmp/testout/*.png | wc -l)
          echo "previews: $count"
          test "$count" -ge 6
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: crop-previews-py${{ matrix.python }}
          path: /tmp/testout/*.png

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash -n setup.sh
