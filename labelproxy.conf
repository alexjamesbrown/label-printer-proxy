# /etc/labelproxy.conf - settings for the labelcrop CUPS backend.
#
# Simple KEY=VALUE. Anything left out falls back to the DEFAULTS dict at the top
# of /usr/lib/cups/backend/labelcrop, which is the authoritative list and
# documents every key. Values can also be overridden per-run with LABELPROXY_<KEY>
# environment variables, which is how the test harness works.
#
# No restart needed: the backend reads this file on every job.

# ---- where jobs go ----------------------------------------------------------
# Normally taken from the queue's DEVICE_URI (labelcrop:/<queue>); this is the
# fallback. The target queue must exist and should not be shared.
TARGET_QUEUE=Brother_QL

# Media name to request. The QL-1110NWB reports media-default=29x90mm whatever
# roll is actually loaded, so this has to be stated explicitly or output comes
# out the wrong size. Confirm the loaded roll with:
#   ipptool -tv ipp://<printer>/ipp/print get-printer-attributes.test | grep media-ready
MEDIA=om_brother-label-103x164mm_103x164mm

# Cutter, as an IPP finishings enum:
#   3 = none, 11 = trim, 60 = trim-after-pages (every label), 63 = trim-after-job
# CUPS sets this queue to 3 (none) whatever the printer's own default is, so
# labels come out uncut unless it is stated here.
FINISHINGS=60

# ---- the roll ---------------------------------------------------------------
LABEL_W_MM=103
LABEL_H_MM=164

# Unprintable edges the printer reports in media-col-ready. Content placed
# outside these is clipped by the hardware, not by us.
MARGIN_L_MM=1.54
MARGIN_R_MM=1.54
MARGIN_T_MM=3.03
MARGIN_B_MM=3.03

# Extra breathing room inside the printable area (cosmetic), and padding kept
# around a detected region so a tight crop does not shave the border line.
PAD_MM=1.0
CROP_PAD_MM=1.5

# ---- behaviour --------------------------------------------------------------
# Every non-blank page becomes its own label, up to this many. Stops a stray
# 30-page document eating the roll.
MAX_PAGES=4

# 1 = scale content up to fill the label. UPSCALE_MAX caps it (0 = uncapped).
UPSCALE=1
UPSCALE_MAX=0

# Rotating to landscape must beat portrait by this fraction to be worth doing,
# otherwise near-square labels flip for no gain.
ROTATE_GAIN=0.04

# ---- detection tuning -------------------------------------------------------
# Only worth touching if something is being cropped wrongly. Compare
# /var/lib/labelproxy/*-in.pdf against *-out.pdf first, and re-run the offline
# harness (test_crop.py) rather than experimenting on the roll.
#
# If a header/footer strip is being kept, raise EDGE_BAND_FRAC or EDGE_STRIP_FRAC.
# If a real label edge is being eaten, lower them.
# If a page border is being treated as the label, lower LINE_MAX_FRAC.
# If a label border is being missed, lower LINE_MIN_FRAC.
#
#EDGE_STRIP_FRAC=0.06
#EDGE_BAND_FRAC=0.035
#SPECK_AREA_FRAC=0.0004
#LINE_MIN_FRAC=0.25
#LINE_MAX_FRAC=0.90
#SKIP_CROP_AREA=0.85
#BLANK_CELL_FRAC=0.0008

# ---- debugging --------------------------------------------------------------
# Keep this many in/out PDF pairs. Set KEEP_JOBS=0 to turn off.
KEEP_DIR=/var/lib/labelproxy
KEEP_JOBS=5
